
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mindspace｜小小迷宮設計師 V3</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  overflow:hidden;
  font-family:Arial,"Noto Sans TC",sans-serif;
  color:#26364b;background:#cdeaff
}
button,input{font:inherit}
button{
  border:0;cursor:pointer;
  color:#26364b;font-weight:700;
  -webkit-tap-highlight-color:transparent
}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid #5277dc}
#world{
  position:fixed;inset:0;
  background:linear-gradient(#cdeaff,#f5ebd6)
}
#world canvas{
  width:100%;height:100%;display:block;
  touch-action:none
}
#hud{
  position:fixed;inset:0;
  pointer-events:none;z-index:4
}
#hud>*{pointer-events:auto}
#titleBubble{
  position:absolute;top:18px;left:18px;
  background:#fffffff0;border-radius:20px;
  padding:12px 18px;
  box-shadow:0 5px 20px #32465a22;
  font-weight:bold;font-size:15px
}
#status{
  position:absolute;top:77px;left:18px;
  max-width:min(390px,calc(100vw - 120px));
  background:#ffffffed;
  border-radius:15px;padding:10px 13px;
  font-size:13px;line-height:1.55;
  box-shadow:0 4px 15px #32465a18
}
#viewBar{
  position:absolute;top:18px;right:18px;
  display:flex;gap:7px;
  background:#ffffffdd;padding:6px;
  border-radius:18px
}
#viewBar button{
  padding:10px 12px;border-radius:13px;
  background:transparent;font-size:13px
}
#viewBar button.active{
  background:#5975d9;color:white
}
#bubbleRail{
  position:absolute;right:20px;top:50%;
  transform:translateY(-50%);
  display:flex;flex-direction:column;gap:14px
}
.bubble{
  width:64px;height:64px;border-radius:50%;
  background:#fffffff0;
  box-shadow:0 6px 22px #34496930;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:2px
}
.bubble .symbol{font-size:24px;line-height:1}
.bubble .bubbleLabel{font-size:10px}
.bubble.primary{background:#ffcf64}
.bubble.active{background:#5975d9;color:white}
#joystick{
  position:absolute;bottom:30px;left:30px;
  width:140px;height:140px;border-radius:50%;
  background:#ffffff7a;
  border:3px solid #ffffffd0;
  box-shadow:0 6px 24px #34496922;
  touch-action:none;user-select:none
}
#stick{
  position:absolute;left:50%;top:50%;
  width:62px;height:62px;
  transform:translate(-50%,-50%);
  border-radius:50%;background:#5975d9;
  box-shadow:0 4px 12px #243d7b55
}
#hint{
  position:absolute;bottom:20px;right:20px;
  background:#ffffffd9;border-radius:15px;
  padding:9px 12px;font-size:12px;
  line-height:1.6;max-width:220px
}
#startBanner{
  position:absolute;left:50%;top:100px;
  transform:translateX(-50%);
  padding:13px 20px;
  border-radius:18px;
  background:#ffdf84;
  box-shadow:0 6px 20px #0002;
  font-weight:bold;text-align:center;
  display:none;max-width:80vw
}
#startBanner.show{display:block}
#emptyWelcome{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  background:#fffffff0;
  border-radius:26px;
  padding:28px 34px;
  width:min(420px,80vw);
  text-align:center;
  box-shadow:0 12px 38px #34496920;
  pointer-events:none
}
#emptyWelcome h2{margin:8px 0}
#emptyWelcome p{font-size:14px;line-height:1.8}
.hidden{display:none!important}

/* 掃描工作台：全畫面浮層 */
#scanModal{
  position:fixed;inset:0;z-index:20;
  background:#18243dc9;
  display:none;
  align-items:center;justify-content:center;
  padding:16px
}
#scanModal.open{display:flex}
#scanCard{
  width:min(950px,100%);
  max-height:calc(100dvh - 32px);
  background:#fff;border-radius:24px;
  overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:0 20px 65px #0005
}
#scanHeader{
  display:flex;align-items:center;
  justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid #e3e9f3
}
#scanHeader strong{font-size:17px}
#closeScan{
  background:#edf2f9;border-radius:50%;
  width:38px;height:38px;font-size:22px
}
#scanBody{
  display:grid;
  grid-template-columns:minmax(250px,1fr) minmax(250px,1fr);
  gap:20px;padding:20px;
  overflow:auto
}
#scanLeft,#scanRight{min-width:0}
#scanLeft h3,#scanRight h3{
  margin:0 0 12px;font-size:15px
}
#scanWrap{
  position:relative;width:100%;
  aspect-ratio:1;
  background:#f3f6fa;
  border:2px dashed #bdc9d9;
  border-radius:16px;overflow:hidden
}
#scanCanvas{
  width:100%;height:100%;
  display:block;touch-action:none
}
#scanPlaceholder{
  position:absolute;inset:0;
  display:grid;place-items:center;
  text-align:center;padding:20px;
  pointer-events:none;color:#8190a2
}
.actionRow{
  display:flex;flex-wrap:wrap;gap:8px;
  margin:10px 0
}
.actionRow button{
  flex:1;min-width:90px;
  border-radius:12px;padding:12px 10px;
  background:#eaf0fa;font-size:13px
}
.actionRow button.primary{background:#ffcf64}
.actionRow button.active{
  background:#5975d9;color:white
}
.actionRow button.finish{
  background:#5975d9;color:white;
  font-size:16px;padding:15px
}
.control{
  display:block;margin:16px 0;
  font-size:13px
}
.control input[type=range]{
  display:block;width:100%;margin-top:8px
}
.note{
  font-size:12px;line-height:1.7;
  color:#61738a
}
#scanMessage{
  padding:10px 12px;
  border-radius:12px;
  background:#f2f6fc;
  font-size:12px;line-height:1.6;
  margin-top:10px
}

/* 相機浮層 */
#cameraModal{
  position:fixed;inset:0;z-index:30;
  background:#10192bed;
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  gap:16px;padding:18px
}
#cameraModal.open{display:flex}
#cameraVideo{
  width:min(90vw,750px);
  max-height:72dvh;
  object-fit:contain;
  background:#000;border-radius:18px
}
#cameraModal button{
  padding:13px 22px;border-radius:14px;
  background:#fff
}
#cameraModal #capture{background:#ffcf64}

@media(max-width:760px){
  #titleBubble{
    top:10px;left:10px;padding:9px 11px;
    font-size:12px
  }
  #status{
    top:57px;left:10px;
    font-size:11px;max-width:240px
  }
  #viewBar{
    top:10px;right:8px;gap:2px;padding:4px
  }
  #viewBar button{
    font-size:11px;padding:8px 7px
  }
  #bubbleRail{right:12px;gap:10px}
  .bubble{width:54px;height:54px}
  .bubble .symbol{font-size:21px}
  #joystick{
    left:14px;bottom:18px;
    width:115px;height:115px
  }
  #stick{width:52px;height:52px}
  #hint{
    right:8px;bottom:10px;
    max-width:155px;font-size:10px
  }
  #startBanner{
    top:110px;font-size:12px;
    padding:10px 12px
  }
  #scanBody{
    grid-template-columns:1fr;
    padding:14px;gap:18px
  }
  #scanCard{max-height:calc(100dvh - 16px)}
  #scanModal{padding:8px}
  #scanWrap{max-width:340px;margin:auto}
}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js"
  }
}
</script>

<body>

<div id="world"></div>

<div id="hud">
  <div id="titleBubble">🧩 小小迷宮設計師</div>

  <div id="status" role="status">
    點右側相機泡泡，創造自己的迷宮！
  </div>

  <div id="viewBar">
    <button id="topView" class="active">俯視</button>
    <button id="orbitView">立體</button>
    <button id="firstView">第一人稱</button>
  </div>

  <div id="bubbleRail">
    <button id="cameraBubble" class="bubble primary"
            aria-label="拍照掃描迷宮">
      <span class="symbol">📷</span>
      <span class="bubbleLabel">掃描</span>
    </button>

    <button id="startBubble" class="bubble"
            aria-label="設定探索起點" disabled>
      <span class="symbol">📍</span>
      <span class="bubbleLabel">起點</span>
    </button>

    <button id="resetBubble" class="bubble"
            aria-label="回到探索起點" disabled>
      <span class="symbol">↩️</span>
      <span class="bubbleLabel">返回</span>
    </button>
  </div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <div id="hint">
    搖桿：自由移動<br>
    第一人稱：拖曳轉向<br>
    立體：拖曳旋轉<br>
    電腦：W A S D
  </div>

  <div id="startBanner">
    📍 點選迷宮中的空白通道，決定從哪裡出發！
  </div>

  <div id="emptyWelcome">
    <div style="font-size:42px">🧩</div>
    <h2>創造你的迷宮世界</h2>
    <p>
      用 Plus-Plus 積木排列自己的迷宮，
      點擊右邊的 📷 泡泡拍照，
      就能走進你創造的 3D 世界！
    </p>
  </div>
</div>

<!-- 掃描浮動工作台 -->
<div id="scanModal" role="dialog"
     aria-modal="true" aria-label="迷宮掃描工作台">

  <div id="scanCard">
    <div id="scanHeader">
      <strong>📷 創造我的 3D 迷宮</strong>
      <button id="closeScan" aria-label="關閉掃描視窗">×</button>
    </div>

    <div id="scanBody">
      <section id="scanLeft">
        <h3>① 拍攝實體迷宮</h3>

        <div class="actionRow">
          <button id="openCamera">📷 開啟相機</button>
          <button id="uploadButton">🖼️ 上傳照片</button>
        </div>

        <input id="fileInput" type="file"
               accept="image/*" hidden>

        <div id="scanWrap">
          <canvas id="scanCanvas"
                  width="480" height="480"></canvas>
          <div id="scanPlaceholder">
            等待孩子創造的迷宮照片…
          </div>
        </div>

        <p class="note">
          建議在單色底板上平放積木，
          並從正上方拍攝。
        </p>
      </section>

      <section id="scanRight">
        <h3>② 辨識與修正牆壁</h3>

        <label class="control">
          顏色差異敏感度：
          <span id="thresholdValue">55</span>
          <input id="threshold" type="range"
                 min="15" max="140" value="55">
        </label>

        <div class="actionRow">
          <button id="detect" class="primary">
            🔍 辨識牆壁
          </button>
        </div>

        <label class="control">
          修正筆刷大小：
          <span id="brushValue">3</span>
          <input id="brush" type="range"
                 min="1" max="10" value="3">
        </label>

        <div class="actionRow">
          <button id="addWall">➕ 補牆</button>
          <button id="eraseWall">🧽 擦除</button>
        </div>

        <p class="note">
          紅色半透明區域代表辨識出的牆壁。
          可在左側照片上補牆或擦除。
        </p>

        <h3 style="margin-top:22px">
          ③ 進入我的迷宮世界
        </h3>

        <label class="control">
          牆壁高度：
          <span id="heightValue">2.5</span>
          <input id="wallHeight" type="range"
                 min="1.5" max="5"
                 step=".5" value="2.5">
        </label>

        <div class="actionRow">
          <button id="build" class="finish" disabled>
            ✨ 生成 3D 迷宮
          </button>
        </div>

        <div id="scanMessage">
          先拍照，再辨識牆壁。
          確認後就可以進入 3D 世界！
        </div>
      </section>
    </div>
  </div>
</div>

<!-- 即時相機 -->
<div id="cameraModal">
  <video id="cameraVideo"
         autoplay playsinline muted></video>

  <div class="actionRow">
    <button id="capture">📸 拍攝迷宮</button>
    <button id="closeCamera">關閉相機</button>
  </div>
</div>

<script type="module">
import * as THREE from "three";

const $=id=>document.getElementById(id);

const SIZE=96;
const IMAGE_SIZE=480;
const WORLD_SIZE=20;
const CELL=WORLD_SIZE/SIZE;
const PLAYER_RADIUS=.20;

let wallHeight=2.5;

let hasPhoto=false;
let maskReady=false;
let mazeReady=false;

let mask=new Uint8Array(SIZE*SIZE);
let colors=new Uint8Array(SIZE*SIZE*3);

let editMode="";
let painting=false;
let lastPaintCell=null;

let stream=null;
let scanOpen=false;

let viewMode="top";
let selectingStart=false;

let playerX=0;
let playerZ=0;
let startX=0;
let startZ=0;
let yaw=0;

let orbitYaw=.7;
let orbitPitch=.95;
let orbitDistance=30;

let joystickX=0;
let joystickY=0;
let joystickPointer=null;

let lookingPointer=null;
let lastLookX=0;
let lastLookY=0;
let downLookX=0;
let downLookY=0;

const keys=new Set();

function status(message){
  $("status").textContent=message;
}

function scanMessage(message){
  $("scanMessage").textContent=message;
}

// ====================================
// Three.js 3D 世界
// ====================================

const scene=new THREE.Scene();
scene.background=new THREE.Color("#cdeaff");

const camera=new THREE.PerspectiveCamera(
  65,1,.05,200
);

const renderer=new THREE.WebGLRenderer({
  antialias:true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio||1,2)
);
renderer.outputColorSpace=THREE.SRGBColorSpace;

$("world").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(
  0xffffff,0xb6a9a0,2.3
));

const sunlight=new THREE.DirectionalLight(
  0xffffff,2
);
sunlight.position.set(8,16,10);
scene.add(sunlight);

const floor=new THREE.Mesh(
  new THREE.BoxGeometry(WORLD_SIZE,.2,WORLD_SIZE),
  new THREE.MeshStandardMaterial({
    color:0xf5e9d2,roughness:.9
  })
);
floor.position.y=-.1;
scene.add(floor);

// 暫時使用藍色測試角色
const player=new THREE.Mesh(
  new THREE.SphereGeometry(.28,20,16),
  new THREE.MeshStandardMaterial({
    color:0x5477ef
  })
);
player.position.y=.38;
scene.add(player);

const marker=new THREE.Mesh(
  new THREE.ConeGeometry(.25,.6,4),
  new THREE.MeshStandardMaterial({
    color:0xffb74f
  })
);
marker.rotation.x=Math.PI/2;
marker.position.y=.42;
scene.add(marker);

let mazeGroup=new THREE.Group();
scene.add(mazeGroup);
let mazeResources=[];

// ====================================
// 積木拼接紋理
// ====================================

function createBrickTexture(){
  const canvas=document.createElement("canvas");
  canvas.width=128;
  canvas.height=256;

  const ctx=canvas.getContext("2d");
  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,128,256);

  for(let y=0;y<256;y+=32){
    ctx.fillStyle="#a7a7a7";
    ctx.fillRect(0,y,128,3);

    ctx.fillStyle="#eee";
    ctx.fillRect(0,y+3,128,3);
  }

  for(let row=0;row<8;row++){
    const shift=(row%2)*32;

    for(let x=-64+shift;x<160;x+=64){
      const y=row*32;

      ctx.fillStyle="#b5b5b5";
      ctx.fillRect(x,y,3,32);

      ctx.fillStyle="#eee";
      ctx.fillRect(x+3,y+4,2,24);
    }
  }

  const texture=new THREE.CanvasTexture(canvas);
  texture.colorSpace=THREE.SRGBColorSpace;
  texture.wrapS=THREE.RepeatWrapping;
  texture.wrapT=THREE.RepeatWrapping;

  return texture;
}

const brickTexture=createBrickTexture();

// ====================================
// 掃描視窗
// ====================================

function openScan(){
  scanOpen=true;
  resetJoystick();
  keys.clear();
  $("scanModal").classList.add("open");

  if(!hasPhoto){
    scanMessage("先拍照或上傳迷宮照片。");
  }
}

function closeScan(){
  scanOpen=false;
  $("scanModal").classList.remove("open");
  closeCamera();
}

$("cameraBubble").onclick=openScan;
$("closeScan").onclick=closeScan;

// ====================================
// 照片畫布
// ====================================

const scanCanvas=$("scanCanvas");
const scanCtx=scanCanvas.getContext("2d",{
  willReadFrequently:true
});

const sourceCanvas=document.createElement("canvas");
sourceCanvas.width=IMAGE_SIZE;
sourceCanvas.height=IMAGE_SIZE;

const sourceCtx=sourceCanvas.getContext("2d",{
  willReadFrequently:true
});

function loadImage(image){
  const imageWidth=
    image.videoWidth||
    image.naturalWidth||
    image.width;

  const imageHeight=
    image.videoHeight||
    image.naturalHeight||
    image.height;

  if(!imageWidth||!imageHeight){
    scanMessage("無法取得照片尺寸。");
    return;
  }

  sourceCtx.fillStyle="#fff";
  sourceCtx.fillRect(0,0,480,480);

  const scale=Math.min(
    480/imageWidth,
    480/imageHeight
  );

  const w=imageWidth*scale;
  const h=imageHeight*scale;

  sourceCtx.drawImage(
    image,
    (480-w)/2,
    (480-h)/2,
    w,h
  );

  hasPhoto=true;
  maskReady=false;
  mask.fill(0);

  $("scanPlaceholder").classList.add("hidden");
  $("build").disabled=true;

  setEditMode("");
  renderScan();

  scanMessage("照片已載入，請按「辨識牆壁」。");
}

$("uploadButton").onclick=()=>{
  $("fileInput").click();
};

$("fileInput").onchange=event=>{
  const file=event.target.files?.[0];
  if(!file)return;

  const url=URL.createObjectURL(file);
  const image=new Image();

  image.onload=()=>{
    loadImage(image);
    URL.revokeObjectURL(url);
  };

  image.onerror=()=>{
    scanMessage("圖片載入失敗。");
    URL.revokeObjectURL(url);
  };

  image.src=url;
  event.target.value="";
};

// ====================================
// 相機
// ====================================

async function openCamera(){
  try{
    if(!navigator.mediaDevices?.getUserMedia){
      throw new Error(
        "瀏覽器不支援相機，或目前不是 HTTPS 網頁"
      );
    }

    stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:"environment"}
      },
      audio:false
    });

    const video=$("cameraVideo");
    video.srcObject=stream;

    $("cameraModal").classList.add("open");
    await video.play();

  }catch(error){
    closeCamera();
    scanMessage("相機開啟失敗："+error.message);
  }
}

function closeCamera(){
  if(stream){
    stream.getTracks().forEach(track=>track.stop());
    stream=null;
  }

  $("cameraVideo").srcObject=null;
  $("cameraModal").classList.remove("open");
}

$("openCamera").onclick=openCamera;
$("closeCamera").onclick=closeCamera;

$("capture").onclick=()=>{
  const video=$("cameraVideo");

  if(!video.videoWidth){
    scanMessage("相機尚未準備完成。");
    return;
  }

  loadImage(video);
  closeCamera();
};

// ====================================
// 掃描辨識
// ====================================

function getPixel(data,x,y){
  const p=(y*480+x)*4;

  return [
    data[p],
    data[p+1],
    data[p+2]
  ];
}

function renderScan(){
  scanCtx.clearRect(0,0,480,480);

  if(!hasPhoto)return;

  scanCtx.drawImage(sourceCanvas,0,0);

  if(!maskReady)return;

  const base=sourceCtx.getImageData(
    0,0,480,480
  );

  for(let y=0;y<480;y++){
    for(let x=0;x<480;x++){
      const gx=Math.min(
        SIZE-1,Math.floor(x/480*SIZE)
      );
      const gy=Math.min(
        SIZE-1,Math.floor(y/480*SIZE)
      );

      if(!mask[gy*SIZE+gx])continue;

      const p=(y*480+x)*4;
      const a=.45;

      base.data[p]=Math.round(
        base.data[p]*(1-a)+255*a
      );
      base.data[p+1]=Math.round(
        base.data[p+1]*(1-a)+55*a
      );
      base.data[p+2]=Math.round(
        base.data[p+2]*(1-a)+65*a
      );
    }
  }

  scanCtx.putImageData(base,0,0);
}

function detectWalls(){
  if(!hasPhoto){
    scanMessage("請先拍攝或上傳迷宮。");
    return;
  }

  const pixels=sourceCtx.getImageData(
    0,0,480,480
  ).data;

  const positions=[
    [10,10],[240,10],[469,10],
    [10,240],[469,240],
    [10,469],[240,469],[469,469]
  ];

  const samples=positions.map(([x,y])=>
    getPixel(pixels,x,y)
  );

  const background=[0,1,2].map(c=>{
    const values=samples
      .map(s=>s[c])
      .sort((a,b)=>a-b);

    return values[Math.floor(values.length/2)];
  });

  const threshold=Number($("threshold").value);
  const next=new Uint8Array(SIZE*SIZE);

  for(let gy=0;gy<SIZE;gy++){
    for(let gx=0;gx<SIZE;gx++){
      const x=Math.min(
        479,Math.floor((gx+.5)*480/SIZE)
      );
      const y=Math.min(
        479,Math.floor((gy+.5)*480/SIZE)
      );

      const rgb=getPixel(pixels,x,y);
      const index=gy*SIZE+gx;

      for(let c=0;c<3;c++){
        colors[index*3+c]=rgb[c];
      }

      const distance=Math.sqrt(
        (rgb[0]-background[0])**2+
        (rgb[1]-background[1])**2+
        (rgb[2]-background[2])**2
      );

      next[index]=distance>threshold?1:0;
    }
  }

  const cleaned=new Uint8Array(next);

  for(let gy=1;gy<SIZE-1;gy++){
    for(let gx=1;gx<SIZE-1;gx++){
      const i=gy*SIZE+gx;
      if(!next[i])continue;

      let count=0;

      for(let dy=-1;dy<=1;dy++){
        for(let dx=-1;dx<=1;dx++){
          count+=next[(gy+dy)*SIZE+(gx+dx)];
        }
      }

      if(count<=2)cleaned[i]=0;
    }
  }

  mask=cleaned;
  maskReady=true;
  $("build").disabled=false;

  renderScan();

  scanMessage(
    "辨識完成！紅色區域為牆壁，可補牆或擦除。"
  );
}

$("detect").onclick=detectWalls;

$("threshold").oninput=event=>{
  $("thresholdValue").textContent=event.target.value;
};

$("brush").oninput=event=>{
  $("brushValue").textContent=event.target.value;
};

// ====================================
// 手動修正牆壁
// ====================================

function setEditMode(mode){
  editMode=mode;

  $("addWall").classList.toggle(
    "active",mode==="add"
  );
  $("eraseWall").classList.toggle(
    "active",mode==="erase"
  );
}

$("addWall").onclick=()=>{
  setEditMode(editMode==="add"?"":"add");
};

$("eraseWall").onclick=()=>{
  setEditMode(editMode==="erase"?"":"erase");
};

function eventToCell(event){
  const rect=scanCanvas.getBoundingClientRect();

  return {
    gx:Math.floor(
      (event.clientX-rect.left)/rect.width*SIZE
    ),
    gy:Math.floor(
      (event.clientY-rect.top)/rect.height*SIZE
    )
  };
}

function paintCell(gx,gy){
  const radius=Number($("brush").value);

  for(let dy=-radius;dy<=radius;dy++){
    for(let dx=-radius;dx<=radius;dx++){
      if(dx*dx+dy*dy>radius*radius)continue;

      const x=gx+dx;
      const y=gy+dy;

      if(x<0||y<0||x>=SIZE||y>=SIZE)continue;

      const index=y*SIZE+x;
      mask[index]=editMode==="add"?1:0;

      if(editMode==="add"){
        const sx=Math.max(
          0,Math.min(SIZE-1,gx)
        );
        const sy=Math.max(
          0,Math.min(SIZE-1,gy)
        );
        const sourceIndex=sy*SIZE+sx;

        for(let c=0;c<3;c++){
          colors[index*3+c]=
            colors[sourceIndex*3+c];
        }
      }
    }
  }
}

function paintAt(event){
  if(!maskReady||!editMode)return;

  const current=eventToCell(event);

  if(!lastPaintCell){
    paintCell(current.gx,current.gy);
  }else{
    const dx=current.gx-lastPaintCell.gx;
    const dy=current.gy-lastPaintCell.gy;

    const steps=Math.max(
      1,Math.ceil(Math.hypot(dx,dy))
    );

    for(let i=0;i<=steps;i++){
      const t=i/steps;

      paintCell(
        Math.round(lastPaintCell.gx+dx*t),
        Math.round(lastPaintCell.gy+dy*t)
      );
    }
  }

  lastPaintCell=current;
  renderScan();
}

scanCanvas.addEventListener("pointerdown",event=>{
  if(!maskReady||!editMode)return;

  painting=true;
  lastPaintCell=null;
  scanCanvas.setPointerCapture(event.pointerId);
  paintAt(event);
});

scanCanvas.addEventListener("pointermove",event=>{
  if(painting)paintAt(event);
});

function stopPainting(){
  painting=false;
  lastPaintCell=null;
}

scanCanvas.addEventListener("pointerup",stopPainting);
scanCanvas.addEventListener("pointercancel",stopPainting);

// ====================================
// 碰撞與位置
// ====================================

function isWall(gx,gy){
  if(gx<0||gy<0||gx>=SIZE||gy>=SIZE){
    return true;
  }

  return mask[gy*SIZE+gx]===1;
}

function collides(x,z){
  const r=PLAYER_RADIUS;

  const minGX=Math.floor(
    (x-r+WORLD_SIZE/2)/CELL
  );
  const maxGX=Math.floor(
    (x+r+WORLD_SIZE/2)/CELL
  );
  const minGY=Math.floor(
    (z-r+WORLD_SIZE/2)/CELL
  );
  const maxGY=Math.floor(
    (z+r+WORLD_SIZE/2)/CELL
  );

  for(let gy=minGY;gy<=maxGY;gy++){
    for(let gx=minGX;gx<=maxGX;gx++){
      if(!isWall(gx,gy))continue;

      const left=gx*CELL-WORLD_SIZE/2;
      const right=left+CELL;
      const top=gy*CELL-WORLD_SIZE/2;
      const bottom=top+CELL;

      const closestX=Math.max(
        left,Math.min(x,right)
      );
      const closestZ=Math.max(
        top,Math.min(z,bottom)
      );

      const dx=x-closestX;
      const dz=z-closestZ;

      if(dx*dx+dz*dz<r*r){
        return true;
      }
    }
  }

  return false;
}

function findStart(){
  for(let gy=SIZE-4;gy>=3;gy--){
    for(let offset=0;offset<SIZE/2;offset++){
      for(const sign of [-1,1]){
        const gx=Math.floor(SIZE/2)+offset*sign;

        if(gx<3||gx>=SIZE-3)continue;

        const x=(gx+.5)*CELL-WORLD_SIZE/2;
        const z=(gy+.5)*CELL-WORLD_SIZE/2;

        if(!collides(x,z))return {x,z};
      }
    }
  }

  return null;
}

// ====================================
// 真實照片資料 → 3D 牆壁
// ====================================

function clearMaze(){
  scene.remove(mazeGroup);

  for(const resource of mazeResources){
    resource.dispose();
  }

  mazeResources=[];
  mazeGroup=new THREE.Group();
  scene.add(mazeGroup);
}

function buildMaze(){
  if(!maskReady)return;

  const start=findStart();

  if(!start){
    scanMessage(
      "找不到足夠寬的通道，請先擦除部分牆壁。"
    );
    return;
  }

  clearMaze();

  wallHeight=Number($("wallHeight").value);

  const geometry=new THREE.BoxGeometry(
    CELL,wallHeight,CELL
  );

  mazeResources.push(geometry);

  const groups=new Map();
  const quantize=value=>
    Math.min(255,Math.round(value/32)*32);

  for(let gy=0;gy<SIZE;gy++){
    for(let gx=0;gx<SIZE;gx++){
      const index=gy*SIZE+gx;
      if(!mask[index])continue;

      const key=[
        quantize(colors[index*3]),
        quantize(colors[index*3+1]),
        quantize(colors[index*3+2])
      ].join(",");

      if(!groups.has(key)){
        groups.set(key,[]);
      }

      groups.get(key).push({gx,gy});
    }
  }

  const dummy=new THREE.Object3D();
  let count=0;

  for(const [key,cells] of groups){
    const [r,g,b]=key.split(",").map(Number);

    const material=new THREE.MeshStandardMaterial({
      color:new THREE.Color(
        `rgb(${r},${g},${b})`
      ),
      map:brickTexture,
      roughness:.85
    });

    mazeResources.push(material);

    const mesh=new THREE.InstancedMesh(
      geometry,material,cells.length
    );

    for(let i=0;i<cells.length;i++){
      const {gx,gy}=cells[i];

      dummy.position.set(
        (gx+.5)*CELL-WORLD_SIZE/2,
        wallHeight/2,
        (gy+.5)*CELL-WORLD_SIZE/2
      );

      dummy.rotation.set(0,0,0);
      dummy.scale.set(1,1,1);
      dummy.updateMatrix();

      mesh.setMatrixAt(i,dummy.matrix);
    }

    mesh.instanceMatrix.needsUpdate=true;
    mesh.computeBoundingSphere();
    mazeGroup.add(mesh);

    count+=cells.length;
  }

  playerX=start.x;
  playerZ=start.z;
  startX=start.x;
  startZ=start.z;
  yaw=0;

  mazeReady=true;

  $("startBubble").disabled=false;
  $("resetBubble").disabled=false;
  $("emptyWelcome").classList.add("hidden");

  // 生成成功：自動關閉掃描視窗
  closeScan();

  // 立即進入選擇起點流程
  setView("top");
  beginSelectStart();

  status(
    `已生成 ${count} 個牆壁單元！請選擇探索起點。`
  );
}

$("build").onclick=buildMaze;

$("wallHeight").oninput=event=>{
  $("heightValue").textContent=event.target.value;
};

// ====================================
// 自由設定起點
// ====================================

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

const groundPlane=new THREE.Plane(
  new THREE.Vector3(0,1,0),0
);
const hitPoint=new THREE.Vector3();

function beginSelectStart(){
  if(!mazeReady)return;

  selectingStart=true;
  resetJoystick();
  keys.clear();

  setView("top");

  $("startBubble").classList.add("active");
  $("startBanner").classList.add("show");

  status("請點選迷宮中的空白通道，設定探索起點。");
}

function endSelectStart(){
  selectingStart=false;

  $("startBubble").classList.remove("active");
  $("startBanner").classList.remove("show");
}

function chooseStartAt(event){
  const rect=renderer.domElement.getBoundingClientRect();

  pointer.x=
    ((event.clientX-rect.left)/rect.width)*2-1;
  pointer.y=
    -((event.clientY-rect.top)/rect.height)*2+1;

  raycaster.setFromCamera(pointer,camera);

  if(!raycaster.ray.intersectPlane(
    groundPlane,hitPoint
  )){
    status("請點選迷宮地板。");
    return;
  }

  const x=hitPoint.x;
  const z=hitPoint.z;

  if(collides(x,z)){
    status("這裡是牆壁或通道太窄，請換個地方。");
    return;
  }

  playerX=x;
  playerZ=z;
  startX=x;
  startZ=z;
  yaw=0;

  endSelectStart();
  updatePlayer();

  status("起點設定成功！切換第一人稱開始探索吧！");
}

$("startBubble").onclick=()=>{
  if(!mazeReady)return;

  if(selectingStart){
    endSelectStart();
    status("已取消設定起點。");
  }else{
    beginSelectStart();
  }
};

$("resetBubble").onclick=()=>{
  if(!mazeReady)return;

  playerX=startX;
  playerZ=startZ;
  yaw=0;

  updatePlayer();
  status("已回到探索起點。");
};

// ====================================
// 視角
// ====================================

function setView(mode){
  viewMode=mode;

  $("topView").classList.toggle(
    "active",mode==="top"
  );
  $("orbitView").classList.toggle(
    "active",mode==="orbit"
  );
  $("firstView").classList.toggle(
    "active",mode==="first"
  );

  if(selectingStart&&mode!=="top"){
    endSelectStart();
  }

  updateCamera();
}

$("topView").onclick=()=>setView("top");
$("orbitView").onclick=()=>setView("orbit");
$("firstView").onclick=()=>setView("first");

function updatePlayer(){
  player.position.set(playerX,.38,playerZ);
  marker.position.set(playerX,.42,playerZ);
  marker.rotation.z=-yaw;
}

function updateCamera(){
  const showPlayer=mazeReady&&viewMode!=="first";

  player.visible=showPlayer;
  marker.visible=showPlayer;

  if(viewMode==="top"){
    camera.up.set(0,0,-1);

    // 適應不同螢幕比例，盡量顯示完整迷宮。
    const aspect=Math.max(.5,camera.aspect);
    const height=Math.max(24,15/aspect);

    camera.position.set(
      playerX,height,playerZ+.01
    );
    camera.lookAt(playerX,0,playerZ);
  }

  if(viewMode==="orbit"){
    camera.up.set(0,1,0);

    const horizontal=
      orbitDistance*Math.sin(orbitPitch);

    camera.position.set(
      Math.sin(orbitYaw)*horizontal,
      orbitDistance*Math.cos(orbitPitch),
      Math.cos(orbitYaw)*horizontal
    );

    camera.lookAt(0,0,0);
  }

  if(viewMode==="first"){
    camera.up.set(0,1,0);
    camera.position.set(
      playerX,1.35,playerZ
    );

    camera.lookAt(
      playerX+Math.sin(yaw),
      1.35,
      playerZ-Math.cos(yaw)
    );
  }
}

// ====================================
// 虛擬搖桿
// ====================================

const joystick=$("joystick");
const stick=$("stick");

function moveStick(event){
  const rect=joystick.getBoundingClientRect();

  const cx=rect.left+rect.width/2;
  const cy=rect.top+rect.height/2;

  let dx=event.clientX-cx;
  let dy=event.clientY-cy;

  const max=rect.width*.31;
  const length=Math.hypot(dx,dy);

  if(length>max){
    dx=dx/length*max;
    dy=dy/length*max;
  }

  joystickX=dx/max;
  joystickY=dy/max;

  stick.style.left=`calc(50% + ${dx}px)`;
  stick.style.top=`calc(50% + ${dy}px)`;
}

function resetJoystick(){
  joystickPointer=null;
  joystickX=0;
  joystickY=0;

  stick.style.left="50%";
  stick.style.top="50%";
}

joystick.addEventListener("pointerdown",event=>{
  if(scanOpen||selectingStart)return;

  joystickPointer=event.pointerId;
  joystick.setPointerCapture(event.pointerId);
  moveStick(event);
});

joystick.addEventListener("pointermove",event=>{
  if(event.pointerId===joystickPointer){
    moveStick(event);
  }
});

function releaseStick(event){
  if(event.pointerId===joystickPointer){
    resetJoystick();
  }
}

joystick.addEventListener("pointerup",releaseStick);
joystick.addEventListener("pointercancel",releaseStick);
joystick.addEventListener("lostpointercapture",resetJoystick);

// ====================================
// 世界畫面拖曳
// ====================================

const worldCanvas=renderer.domElement;

worldCanvas.addEventListener("pointerdown",event=>{
  if(scanOpen)return;

  lookingPointer=event.pointerId;

  lastLookX=event.clientX;
  lastLookY=event.clientY;
  downLookX=event.clientX;
  downLookY=event.clientY;

  worldCanvas.setPointerCapture(event.pointerId);
});

worldCanvas.addEventListener("pointermove",event=>{
  if(event.pointerId!==lookingPointer)return;

  const dx=event.clientX-lastLookX;
  const dy=event.clientY-lastLookY;

  if(viewMode==="first"){
    yaw+=dx*.006;
  }

  if(viewMode==="orbit"){
    orbitYaw-=dx*.006;
    orbitPitch=Math.max(
      .25,
      Math.min(1.45,orbitPitch+dy*.006)
    );
  }

  lastLookX=event.clientX;
  lastLookY=event.clientY;
});

worldCanvas.addEventListener("pointerup",event=>{
  if(event.pointerId!==lookingPointer)return;

  const distance=Math.hypot(
    event.clientX-downLookX,
    event.clientY-downLookY
  );

  if(selectingStart&&distance<10){
    chooseStartAt(event);
  }

  lookingPointer=null;
});

worldCanvas.addEventListener("pointercancel",()=>{
  lookingPointer=null;
});

worldCanvas.addEventListener("wheel",event=>{
  if(viewMode!=="orbit")return;

  event.preventDefault();

  orbitDistance=Math.max(
    15,
    Math.min(55,orbitDistance+event.deltaY*.025)
  );
},{passive:false});

// ====================================
// 鍵盤
// ====================================

window.addEventListener("keydown",event=>{
  if(scanOpen)return;

  const key=event.key.toLowerCase();

  if([
    "w","a","s","d",
    "arrowup","arrowdown",
    "arrowleft","arrowright"
  ].includes(key)){
    event.preventDefault();
    keys.add(key);
  }
});

window.addEventListener("keyup",event=>{
  keys.delete(event.key.toLowerCase());
});

window.addEventListener("blur",()=>{
  keys.clear();
  resetJoystick();
  lookingPointer=null;
});

// ====================================
// 移動與碰撞
// ====================================

function updateMovement(dt){
  if(!mazeReady||scanOpen||selectingStart)return;

  let forward=-joystickY;
  let sideways=joystickX;

  if(keys.has("w")||keys.has("arrowup")){
    forward+=1;
  }
  if(keys.has("s")||keys.has("arrowdown")){
    forward-=1;
  }
  if(keys.has("a")||keys.has("arrowleft")){
    sideways-=1;
  }
  if(keys.has("d")||keys.has("arrowright")){
    sideways+=1;
  }

  const length=Math.hypot(forward,sideways);
  if(length<.08)return;

  const amount=Math.min(1,length);

  forward/=length;
  sideways/=length;

  let dx,dz;

  if(viewMode==="first"){
    dx=
      Math.sin(yaw)*forward+
      Math.cos(yaw)*sideways;

    dz=
      -Math.cos(yaw)*forward+
      Math.sin(yaw)*sideways;
  }else{
    dx=sideways;
    dz=-forward;
  }

  const speed=3*dt*amount;

  // 分軸碰撞，不能穿越牆壁。
  const nextX=playerX+dx*speed;

  if(!collides(nextX,playerZ)){
    playerX=nextX;
  }

  const nextZ=playerZ+dz*speed;

  if(!collides(playerX,nextZ)){
    playerZ=nextZ;
  }

  updatePlayer();
}

// ====================================
// 渲染
// ====================================

function resize(){
  const rect=$("world").getBoundingClientRect();

  if(rect.width<1||rect.height<1)return;

  camera.aspect=rect.width/rect.height;
  camera.updateProjectionMatrix();

  renderer.setSize(
    rect.width,rect.height,false
  );
}

new ResizeObserver(resize).observe($("world"));

const clock=new THREE.Clock();

function animate(){
  const dt=Math.min(clock.getDelta(),.05);

  updateMovement(dt);
  updateCamera();

  renderer.render(scene,camera);
}

resize();
updateCamera();
renderer.setAnimationLoop(animate);

status("點右側 📷 相機泡泡，創造自己的迷宮！");

</script>
