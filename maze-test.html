
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mindspace｜小小迷宮設計師 V2</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  font-family:Arial,"Noto Sans TC",sans-serif;
  background:#eaf3ff;color:#26364b
}
button,input{font:inherit}
button{
  border:0;border-radius:12px;padding:11px 14px;
  background:#e2ebf8;color:#26364b;
  font-weight:bold;cursor:pointer
}
button.primary{background:#ffcf64}
button.active{background:#5975d9;color:white}
button:disabled{opacity:.45;cursor:not-allowed}
#app{height:100dvh;display:flex;flex-direction:column}
header{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:10px 14px;background:white;
  box-shadow:0 2px 12px #0001;z-index:5
}
header strong{font-size:16px}
#status{font-size:12px;color:#526781}
#workspace{
  flex:1;min-height:0;display:grid;
  grid-template-columns:minmax(290px,360px) 1fr
}
#panel{
  padding:14px;overflow:auto;background:#fff;
  border-right:1px solid #dce5f2
}
h2{font-size:16px;margin:12px 0}
small{line-height:1.55;color:#61738a}
.group{margin-bottom:16px}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.actions button{flex:1;min-width:85px}
label{display:block;margin:10px 0;font-size:13px}
input[type="range"]{width:100%}
#scanWrap{
  position:relative;width:100%;aspect-ratio:1;
  background:#f2f5fa;border:2px dashed #bac9dc;
  border-radius:14px;overflow:hidden;touch-action:none
}
#scanCanvas{
  width:100%;height:100%;display:block;
  touch-action:none;cursor:crosshair
}
#scanHint{
  position:absolute;inset:0;display:grid;place-items:center;
  text-align:center;padding:25px;pointer-events:none;
  color:#72839a
}
#scanHint.hidden{display:none}
#worldWrap{
  position:relative;overflow:hidden;min-height:0;
  background:linear-gradient(#cceaff,#f8f0dc)
}
#world{position:absolute;inset:0}
#world canvas{
  display:block;width:100%;height:100%;touch-action:none
}
#viewButtons{
  position:absolute;right:14px;top:14px;
  z-index:3;display:flex;gap:6px;flex-wrap:wrap;
  justify-content:flex-end
}
#viewButtons button{padding:10px}
#joystick{
  position:absolute;bottom:26px;left:26px;
  width:132px;height:132px;border-radius:50%;
  background:#ffffff80;border:3px solid #ffffffb0;
  z-index:3;touch-action:none;user-select:none
}
#stick{
  position:absolute;left:50%;top:50%;
  width:58px;height:58px;border-radius:50%;
  background:#5e80d9;transform:translate(-50%,-50%);
  box-shadow:0 4px 12px #0002
}
#help{
  position:absolute;bottom:15px;right:15px;
  background:#ffffffe0;padding:9px 12px;
  border-radius:12px;font-size:12px;
  max-width:240px;pointer-events:none;
  line-height:1.6
}
#startButton{
  position:absolute;top:68px;right:14px;
  z-index:4;background:#ffcf64
}
#startButton.active{background:#5975d9;color:white}
#cameraLayer{
  position:fixed;inset:0;background:#0b1527ee;
  display:none;z-index:20;align-items:center;
  justify-content:center;flex-direction:column;
  padding:20px;gap:12px
}
#cameraLayer.open{display:flex}
#cameraVideo{
  width:min(90vw,650px);max-height:70vh;
  object-fit:contain;background:#000;border-radius:16px
}
#cameraLayer .actions{justify-content:center}
@media(max-width:760px){
  #workspace{
    grid-template-columns:1fr;
    grid-template-rows:48% 52%
  }
  #panel{
    border-right:0;border-bottom:1px solid #ddd
  }
  #scanWrap{max-width:320px;margin:auto}
  #joystick{
    width:110px;height:110px;bottom:14px;left:14px
  }
  #help{max-width:155px;font-size:11px}
  header strong{font-size:13px}
  #viewButtons{left:8px;right:8px}
  #viewButtons button{padding:8px}
  #startButton{top:60px;right:8px}
}

<body>
<div id="app">
<header>
  <strong>🧩 Mindspace｜小小迷宮設計師 V2</strong>
  <span id="status">請拍攝或上傳積木迷宮</span>
</header>

<div id="workspace">
<aside id="panel">

<h2>① 拍攝實體積木迷宮</h2>
<div class="group">
  <div class="actions">
    <button id="openCamera">📷 開啟相機</button>
    <button id="uploadButton">🖼️ 上傳照片</button>
  </div>
  <input id="fileInput" type="file" accept="image/*" hidden>
  <small>
    建議使用單色底板，從正上方拍攝。
    確保整個迷宮都在畫面中。
  </small>
</div>

<div id="scanWrap">
  <canvas id="scanCanvas" width="480" height="480"></canvas>
  <div id="scanHint">等待迷宮照片…</div>
</div>

<h2>② 辨識與修正牆壁</h2>

<label>
  顏色差異敏感度：
  <span id="thresholdValue">55</span>
  <input id="threshold" type="range"
         min="15" max="140" value="55">
</label>

<label>
  牆壁修正筆刷：
  <span id="brushValue">3</span>
  <input id="brush" type="range"
         min="1" max="10" value="3">
</label>

<div class="actions">
  <button id="detect" class="primary">🔍 辨識牆壁</button>
  <button id="addWall">➕ 補牆</button>
  <button id="eraseWall">🧽 擦除</button>
</div>

<small>
  紅色半透明區域代表牆壁。
  可以直接在照片上補牆或擦除辨識錯誤的部分。
</small>

<h2>③ 生成自己的 3D 迷宮</h2>

<div class="actions">
  <button id="build" class="primary" disabled>
    ✨ 生成 3D 迷宮
  </button>
  <button id="resetPlayer" disabled>
    ↩️ 重設位置
  </button>
</div>

<label>
  牆壁高度：
  <span id="heightValue">2.5</span>
  <input id="wallHeight" type="range"
         min="1.5" max="5" step=".5" value="2.5">
</label>

<small>
  生成後可以切換俯視、立體及第一人稱。
  點選「設定起點」，再於俯視畫面點選通道。
</small>

</aside>

<main id="worldWrap">
  <div id="world"></div>

  <div id="viewButtons">
    <button id="topView" class="active">俯視</button>
    <button id="orbitView">立體視角</button>
    <button id="firstView">第一人稱</button>
  </div>

  <button id="startButton" disabled>
    📍 設定起點
  </button>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <div id="help">
    搖桿：移動角色<br>
    第一人稱：拖曳畫面轉向<br>
    立體視角：拖曳旋轉觀察<br>
    電腦：W A S D 移動
  </div>
</main>
</div>
</div>

<div id="cameraLayer">
  <video id="cameraVideo" autoplay playsinline muted></video>
  <div class="actions">
    <button id="capture" class="primary">📸 拍攝迷宮</button>
    <button id="closeCamera">關閉相機</button>
  </div>
</div>

<script type="module">
import * as THREE from "three";

"use strict";

const $ = id => document.getElementById(id);
const status = message => {
  $("status").textContent = message;
};

const SIZE = 96;
const IMAGE_SIZE = 480;
const WORLD_SIZE = 20;
const CELL = WORLD_SIZE / SIZE;
const PLAYER_RADIUS = .20;

let wallHeight = 2.5;

const scanCanvas = $("scanCanvas");
const scanCtx = scanCanvas.getContext("2d",{
  willReadFrequently:true
});

const sourceCanvas = document.createElement("canvas");
sourceCanvas.width = IMAGE_SIZE;
sourceCanvas.height = IMAGE_SIZE;

const sourceCtx = sourceCanvas.getContext("2d",{
  willReadFrequently:true
});

let hasPhoto = false;
let maskReady = false;
let mask = new Uint8Array(SIZE*SIZE);
let colors = new Uint8Array(SIZE*SIZE*3);

let editMode = "";
let painting = false;
let lastPaintCell = null;

let stream = null;

let mazeReady = false;
let viewMode = "top";
let selectingStart = false;

let playerX = 0;
let playerZ = 0;
let startX = 0;
let startZ = 0;

let yaw = 0;
let orbitYaw = .7;
let orbitPitch = .95;
let orbitDistance = 30;

let joystickX = 0;
let joystickY = 0;
let joystickPointer = null;

let lookingPointer = null;
let lastLookX = 0;
let lastLookY = 0;
let lastLookDownX = 0;
let lastLookDownY = 0;

const keys = new Set();

// ========================================
// THREE.JS 基本場景
// ========================================

const scene = new THREE.Scene();
scene.background = new THREE.Color("#cdeaff");

const camera = new THREE.PerspectiveCamera(
  65,1,.05,200
);

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,2)
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

$("world").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(
  0xffffff,0xb6a9a0,2.3
));

const sunlight = new THREE.DirectionalLight(
  0xffffff,2
);

sunlight.position.set(8,16,10);
scene.add(sunlight);

const floor = new THREE.Mesh(
  new THREE.BoxGeometry(WORLD_SIZE,.2,WORLD_SIZE),
  new THREE.MeshStandardMaterial({
    color:0xf5e9d2,
    roughness:.9
  })
);

floor.position.y=-.1;
scene.add(floor);

// 測試角色：後續會換成孩子自己的積木角色
const player = new THREE.Mesh(
  new THREE.SphereGeometry(.28,20,16),
  new THREE.MeshStandardMaterial({
    color:0x5477ef
  })
);

player.position.y=.38;
scene.add(player);

const playerMarker = new THREE.Mesh(
  new THREE.ConeGeometry(.25,.6,4),
  new THREE.MeshStandardMaterial({
    color:0xffb74f
  })
);

playerMarker.rotation.x=Math.PI/2;
playerMarker.position.y=.42;
scene.add(playerMarker);

let mazeGroup = new THREE.Group();
scene.add(mazeGroup);

let mazeResources = [];

// ========================================
// 積木風格紋理
// ========================================

// 這是程式生成的積木拼接紋理。
// 不是聲稱已辨識出每一顆 Plus-Plus 積木。

function createBrickTexture(){
  const canvas=document.createElement("canvas");
  canvas.width=128;
  canvas.height=256;

  const ctx=canvas.getContext("2d");

  ctx.fillStyle="#ffffff";
  ctx.fillRect(0,0,128,256);

  // 水平拼接縫
  for(let y=0;y<256;y+=32){
    ctx.fillStyle="#a7a7a7";
    ctx.fillRect(0,y,128,3);

    ctx.fillStyle="#eeeeee";
    ctx.fillRect(0,y+3,128,3);
  }

  // 交錯拼接縫
  for(let row=0;row<8;row++){
    const shift=(row%2)*32;

    for(let x=-64+shift;x<160;x+=64){
      const y=row*32;

      ctx.fillStyle="#b5b5b5";
      ctx.fillRect(x,y,3,32);

      ctx.fillStyle="#eeeeee";
      ctx.fillRect(x+3,y+4,2,24);
    }
  }

  // 表面輕微凹凸線條
  ctx.globalAlpha=.18;

  for(let y=12;y<256;y+=32){
    ctx.fillStyle="#777777";
    ctx.fillRect(12,y,104,2);
  }

  ctx.globalAlpha=1;

  const texture=new THREE.CanvasTexture(canvas);
  texture.colorSpace=THREE.SRGBColorSpace;
  texture.wrapS=THREE.RepeatWrapping;
  texture.wrapT=THREE.RepeatWrapping;

  return texture;
}

const brickTexture=createBrickTexture();

// ========================================
// 照片載入
// ========================================

function loadImage(image){
  const imageWidth=
    image.videoWidth||
    image.naturalWidth||
    image.width;

  const imageHeight=
    image.videoHeight||
    image.naturalHeight||
    image.height;

  if(!imageWidth||!imageHeight){
    status("無法取得照片尺寸");
    return;
  }

  sourceCtx.fillStyle="#ffffff";
  sourceCtx.fillRect(0,0,480,480);

  const scale=Math.min(
    480/imageWidth,
    480/imageHeight
  );

  const w=imageWidth*scale;
  const h=imageHeight*scale;

  sourceCtx.drawImage(
    image,
    (480-w)/2,
    (480-h)/2,
    w,h
  );

  hasPhoto=true;
  maskReady=false;
  mask.fill(0);

  $("scanHint").classList.add("hidden");
  $("build").disabled=true;

  setEditMode("");
  renderScan();

  status("照片已載入，請按「辨識牆壁」");
}

$("uploadButton").onclick=()=>{
  $("fileInput").click();
};

$("fileInput").onchange=event=>{
  const file=event.target.files?.[0];
  if(!file)return;

  const url=URL.createObjectURL(file);
  const image=new Image();

  image.onload=()=>{
    loadImage(image);
    URL.revokeObjectURL(url);
  };

  image.onerror=()=>{
    status("圖片載入失敗");
    URL.revokeObjectURL(url);
  };

  image.src=url;
  event.target.value="";
};

// ========================================
// 相機
// ========================================

async function openCamera(){
  try{
    if(!navigator.mediaDevices?.getUserMedia){
      throw new Error("瀏覽器不支援相機，或目前不是 HTTPS 網頁");
    }

    stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:"environment"}
      },
      audio:false
    });

    const video=$("cameraVideo");
    video.srcObject=stream;

    $("cameraLayer").classList.add("open");

    await video.play();

  }catch(error){
    closeCamera();
    status("相機開啟失敗："+error.message);
  }
}

function closeCamera(){
  if(stream){
    stream.getTracks().forEach(track=>track.stop());
    stream=null;
  }

  $("cameraVideo").srcObject=null;
  $("cameraLayer").classList.remove("open");
}

$("openCamera").onclick=openCamera;
$("closeCamera").onclick=closeCamera;

$("capture").onclick=()=>{
  const video=$("cameraVideo");

  if(!video.videoWidth){
    status("相機尚未準備完成");
    return;
  }

  loadImage(video);
  closeCamera();
};

// ========================================
// 顯示掃描結果
// ========================================

function renderScan(){
  scanCtx.clearRect(0,0,480,480);

  if(!hasPhoto)return;

  scanCtx.drawImage(sourceCanvas,0,0);

  if(!maskReady)return;

  const base=sourceCtx.getImageData(
    0,0,480,480
  );

  for(let y=0;y<480;y++){
    for(let x=0;x<480;x++){
      const gx=Math.min(
        SIZE-1,Math.floor(x/480*SIZE)
      );

      const gy=Math.min(
        SIZE-1,Math.floor(y/480*SIZE)
      );

      if(!mask[gy*SIZE+gx])continue;

      const p=(y*480+x)*4;
      const alpha=.45;

      base.data[p]=Math.round(
        base.data[p]*(1-alpha)+255*alpha
      );

      base.data[p+1]=Math.round(
        base.data[p+1]*(1-alpha)+55*alpha
      );

      base.data[p+2]=Math.round(
        base.data[p+2]*(1-alpha)+65*alpha
      );
    }
  }

  scanCtx.putImageData(base,0,0);
}

// ========================================
// 影像辨識
// ========================================

function getPixel(data,x,y){
  const p=(y*480+x)*4;

  return [
    data[p],
    data[p+1],
    data[p+2]
  ];
}

function detectWalls(){
  if(!hasPhoto){
    status("請先拍攝或上傳迷宮");
    return;
  }

  const pixels=sourceCtx.getImageData(
    0,0,480,480
  ).data;

  const positions=[
    [10,10],[240,10],[469,10],
    [10,240],[469,240],
    [10,469],[240,469],[469,469]
  ];

  const samples=positions.map(([x,y])=>
    getPixel(pixels,x,y)
  );

  const background=[0,1,2].map(c=>{
    const values=samples
      .map(s=>s[c])
      .sort((a,b)=>a-b);

    return values[Math.floor(values.length/2)];
  });

  const threshold=Number($("threshold").value);
  const next=new Uint8Array(SIZE*SIZE);

  for(let gy=0;gy<SIZE;gy++){
    for(let gx=0;gx<SIZE;gx++){
      const x=Math.min(
        479,Math.floor((gx+.5)*480/SIZE)
      );

      const y=Math.min(
        479,Math.floor((gy+.5)*480/SIZE)
      );

      const rgb=getPixel(pixels,x,y);
      const index=gy*SIZE+gx;

      for(let c=0;c<3;c++){
        colors[index*3+c]=rgb[c];
      }

      const distance=Math.sqrt(
        (rgb[0]-background[0])**2+
        (rgb[1]-background[1])**2+
        (rgb[2]-background[2])**2
      );

      next[index]=distance>threshold?1:0;
    }
  }

  // 使用原始結果計算鄰居數，
  // 避免清除順序影響其他像素。
  const cleaned=new Uint8Array(next);

  for(let gy=1;gy<SIZE-1;gy++){
    for(let gx=1;gx<SIZE-1;gx++){
      const i=gy*SIZE+gx;
      if(!next[i])continue;

      let count=0;

      for(let dy=-1;dy<=1;dy++){
        for(let dx=-1;dx<=1;dx++){
          count+=next[(gy+dy)*SIZE+(gx+dx)];
        }
      }

      if(count<=2)cleaned[i]=0;
    }
  }

  mask=cleaned;
  maskReady=true;

  $("build").disabled=false;

  renderScan();

  status("辨識完成！可補牆或擦除，再生成 3D 迷宮");
}

$("detect").onclick=detectWalls;

$("threshold").oninput=event=>{
  $("thresholdValue").textContent=event.target.value;
};

$("brush").oninput=event=>{
  $("brushValue").textContent=event.target.value;
};

// ========================================
// 手動補牆與擦除
// ========================================

function setEditMode(mode){
  editMode=mode;

  $("addWall").classList.toggle(
    "active",mode==="add"
  );

  $("eraseWall").classList.toggle(
    "active",mode==="erase"
  );
}

$("addWall").onclick=()=>{
  setEditMode(editMode==="add"?"":"add");
};

$("eraseWall").onclick=()=>{
  setEditMode(editMode==="erase"?"":"erase");
};

function eventToCell(event){
  const rect=scanCanvas.getBoundingClientRect();

  const gx=Math.floor(
    (event.clientX-rect.left)/rect.width*SIZE
  );

  const gy=Math.floor(
    (event.clientY-rect.top)/rect.height*SIZE
  );

  return {gx,gy};
}

function paintCell(gx,gy){
  const radius=Number($("brush").value);

  for(let dy=-radius;dy<=radius;dy++){
    for(let dx=-radius;dx<=radius;dx++){
      if(dx*dx+dy*dy>radius*radius)continue;

      const x=gx+dx;
      const y=gy+dy;

      if(x<0||y<0||x>=SIZE||y>=SIZE)continue;

      mask[y*SIZE+x]=editMode==="add"?1:0;

      // 補牆使用附近照片的顏色，
      // 擦除不修改原始照片。
      if(editMode==="add"){
        const index=y*SIZE+x;
        const sourceIndex=gy*SIZE+gx;

        if(
          sourceIndex>=0 &&
          sourceIndex<SIZE*SIZE
        ){
          colors[index*3]=colors[sourceIndex*3];
          colors[index*3+1]=colors[sourceIndex*3+1];
          colors[index*3+2]=colors[sourceIndex*3+2];
        }
      }
    }
  }
}

function paintAt(event){
  if(!maskReady||!editMode)return;

  const current=eventToCell(event);

  if(!lastPaintCell){
    paintCell(current.gx,current.gy);
  }else{
    // 補足快速拖曳時兩點之間的空隙。
    const dx=current.gx-lastPaintCell.gx;
    const dy=current.gy-lastPaintCell.gy;

    const steps=Math.max(
      1,Math.ceil(Math.hypot(dx,dy))
    );

    for(let i=0;i<=steps;i++){
      const t=i/steps;

      paintCell(
        Math.round(lastPaintCell.gx+dx*t),
        Math.round(lastPaintCell.gy+dy*t)
      );
    }
  }

  lastPaintCell=current;
  renderScan();
}

scanCanvas.addEventListener("pointerdown",event=>{
  if(!maskReady||!editMode)return;

  painting=true;
  lastPaintCell=null;

  scanCanvas.setPointerCapture(event.pointerId);
  paintAt(event);
});

scanCanvas.addEventListener("pointermove",event=>{
  if(painting)paintAt(event);
});

function stopPainting(){
  painting=false;
  lastPaintCell=null;
}

scanCanvas.addEventListener("pointerup",stopPainting);
scanCanvas.addEventListener("pointercancel",stopPainting);

// ========================================
// 牆壁與碰撞
// ========================================

function isWall(gx,gy){
  if(gx<0||gy<0||gx>=SIZE||gy>=SIZE){
    return true;
  }

  return mask[gy*SIZE+gx]===1;
}

function worldToGrid(x,z){
  return {
    gx:Math.floor((x+WORLD_SIZE/2)/CELL),
    gy:Math.floor((z+WORLD_SIZE/2)/CELL)
  };
}

function collides(x,z){
  const r=PLAYER_RADIUS;

  // 圓形角色與格狀牆壁的近似碰撞。
  const minGX=Math.floor((x-r+WORLD_SIZE/2)/CELL);
  const maxGX=Math.floor((x+r+WORLD_SIZE/2)/CELL);
  const minGY=Math.floor((z-r+WORLD_SIZE/2)/CELL);
  const maxGY=Math.floor((z+r+WORLD_SIZE/2)/CELL);

  for(let gy=minGY;gy<=maxGY;gy++){
    for(let gx=minGX;gx<=maxGX;gx++){
      if(!isWall(gx,gy))continue;

      const left=gx*CELL-WORLD_SIZE/2;
      const right=left+CELL;

      const top=gy*CELL-WORLD_SIZE/2;
      const bottom=top+CELL;

      const closestX=Math.max(
        left,Math.min(x,right)
      );

      const closestZ=Math.max(
        top,Math.min(z,bottom)
      );

      const dx=x-closestX;
      const dz=z-closestZ;

      if(dx*dx+dz*dz<r*r){
        return true;
      }
    }
  }

  return false;
}

function findStart(){
  for(let gy=SIZE-4;gy>=3;gy--){
    for(let offset=0;offset<SIZE/2;offset++){
      for(const sign of [-1,1]){
        const gx=Math.floor(SIZE/2)+offset*sign;

        if(gx<3||gx>=SIZE-3)continue;

        const x=(gx+.5)*CELL-WORLD_SIZE/2;
        const z=(gy+.5)*CELL-WORLD_SIZE/2;

        if(!collides(x,z)){
          return {x,z};
        }
      }
    }
  }

  return null;
}

// ========================================
// 生成積木風格 3D 迷宮
// ========================================

function clearMaze(){
  scene.remove(mazeGroup);

  for(const resource of mazeResources){
    resource.dispose();
  }

  mazeResources=[];

  mazeGroup=new THREE.Group();
  scene.add(mazeGroup);
}

function buildMaze(){
  if(!maskReady)return;

  const start=findStart();

  if(!start){
    status("找不到可站立通道，請先修正牆壁");
    return;
  }

  clearMaze();

  wallHeight=Number($("wallHeight").value);

  const geometry=new THREE.BoxGeometry(
    CELL,wallHeight,CELL
  );

  mazeResources.push(geometry);

  // 將相近顏色分組，使用 InstancedMesh，
  // 避免一千多個獨立 Mesh 造成效能負擔。
  const groups=new Map();

  for(let gy=0;gy<SIZE;gy++){
    for(let gx=0;gx<SIZE;gx++){
      const index=gy*SIZE+gx;
      if(!mask[index])continue;

      const r=colors[index*3];
      const g=colors[index*3+1];
      const b=colors[index*3+2];

      const quantize=value=>
        Math.min(255,Math.round(value/32)*32);

      const key=[
        quantize(r),
        quantize(g),
        quantize(b)
      ].join(",");

      if(!groups.has(key)){
        groups.set(key,[]);
      }

      groups.get(key).push({gx,gy});
    }
  }

  const dummy=new THREE.Object3D();
  let count=0;

  for(const [key,cells] of groups){
    const [r,g,b]=key.split(",").map(Number);

    const material=new THREE.MeshStandardMaterial({
      color:new THREE.Color(
        `rgb(${r},${g},${b})`
      ),
      map:brickTexture,
      roughness:.85
    });

    mazeResources.push(material);

    const mesh=new THREE.InstancedMesh(
      geometry,material,cells.length
    );

    for(let i=0;i<cells.length;i++){
      const {gx,gy}=cells[i];

      dummy.position.set(
        (gx+.5)*CELL-WORLD_SIZE/2,
        wallHeight/2,
        (gy+.5)*CELL-WORLD_SIZE/2
      );

      dummy.rotation.set(0,0,0);
      dummy.scale.set(1,1,1);
      dummy.updateMatrix();

      mesh.setMatrixAt(i,dummy.matrix);
    }

    mesh.instanceMatrix.needsUpdate=true;
    mesh.computeBoundingSphere();

    mazeGroup.add(mesh);
    count+=cells.length;
  }

  playerX=start.x;
  playerZ=start.z;

  startX=playerX;
  startZ=playerZ;

  yaw=0;
  mazeReady=true;
  selectingStart=false;

  $("startButton").disabled=false;
  $("startButton").classList.remove("active");
  $("resetPlayer").disabled=false;

  updatePlayer();
  updateCamera();

  status(
    `3D 迷宮建立完成：${count} 個牆壁單元`
  );
}

$("build").onclick=buildMaze;

$("wallHeight").oninput=event=>{
  $("heightValue").textContent=event.target.value;
};

$("resetPlayer").onclick=()=>{
  if(!mazeReady)return;

  playerX=startX;
  playerZ=startZ;
  yaw=0;

  updatePlayer();
  updateCamera();

  status("角色已回到自己選擇的起點");
};

// ========================================
// 自由設定起點
// ========================================

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

const groundPlane=new THREE.Plane(
  new THREE.Vector3(0,1,0),0
);

const hitPoint=new THREE.Vector3();

function chooseStartAt(event){
  const rect=renderer.domElement.getBoundingClientRect();

  pointer.x=
    ((event.clientX-rect.left)/rect.width)*2-1;

  pointer.y=
    -((event.clientY-rect.top)/rect.height)*2+1;

  raycaster.setFromCamera(pointer,camera);

  if(!raycaster.ray.intersectPlane(
    groundPlane,hitPoint
  )){
    status("請點選迷宮地板");
    return;
  }

  const x=hitPoint.x;
  const z=hitPoint.z;

  if(collides(x,z)){
    status("這裡是牆壁或通道太窄，請選其他起點");
    return;
  }

  playerX=x;
  playerZ=z;
  startX=x;
  startZ=z;

  yaw=0;
  selectingStart=false;

  $("startButton").classList.remove("active");

  updatePlayer();
  updateCamera();

  status("起點設定成功！可以開始探索");
}

$("startButton").onclick=()=>{
  if(!mazeReady)return;

  selectingStart=!selectingStart;

  $("startButton").classList.toggle(
    "active",selectingStart
  );

  if(selectingStart){
    setView("top");
    status("請直接點選俯視迷宮中的空白通道");
  }else{
    status("已取消設定起點");
  }
};

// ========================================
// 三種視角
// ========================================

function setView(mode){
  viewMode=mode;

  $("topView").classList.toggle(
    "active",mode==="top"
  );

  $("orbitView").classList.toggle(
    "active",mode==="orbit"
  );

  $("firstView").classList.toggle(
    "active",mode==="first"
  );

  if(selectingStart && mode!=="top"){
    selectingStart=false;
    $("startButton").classList.remove("active");
  }

  updateCamera();
}

$("topView").onclick=()=>setView("top");
$("orbitView").onclick=()=>setView("orbit");
$("firstView").onclick=()=>setView("first");

function updatePlayer(){
  player.position.set(playerX,.38,playerZ);

  playerMarker.position.set(
    playerX,.42,playerZ
  );

  playerMarker.rotation.z=-yaw;
}

function updateCamera(){
  const showPlayer=viewMode!=="first";

  player.visible=showPlayer;
  playerMarker.visible=showPlayer;

  if(viewMode==="top"){
    camera.up.set(0,0,-1);

    camera.position.set(
      playerX,24,playerZ+.01
    );

    camera.lookAt(playerX,0,playerZ);
  }

  if(viewMode==="orbit"){
    camera.up.set(0,1,0);

    // 立體視角以迷宮中心為觀察目標。
    const target=new THREE.Vector3(0,0,0);

    const horizontal=
      orbitDistance*Math.sin(orbitPitch);

    camera.position.set(
      Math.sin(orbitYaw)*horizontal,
      orbitDistance*Math.cos(orbitPitch),
      Math.cos(orbitYaw)*horizontal
    );

    camera.lookAt(target);
  }

  if(viewMode==="first"){
    camera.up.set(0,1,0);

    camera.position.set(
      playerX,1.35,playerZ
    );

    camera.lookAt(
      playerX+Math.sin(yaw),
      1.35,
      playerZ-Math.cos(yaw)
    );
  }
}

// ========================================
// 虛擬搖桿
// ========================================

const joystick=$("joystick");
const stick=$("stick");

function moveStick(event){
  const rect=joystick.getBoundingClientRect();

  const cx=rect.left+rect.width/2;
  const cy=rect.top+rect.height/2;

  let dx=event.clientX-cx;
  let dy=event.clientY-cy;

  const max=rect.width*.31;
  const length=Math.hypot(dx,dy);

  if(length>max){
    dx=dx/length*max;
    dy=dy/length*max;
  }

  joystickX=dx/max;
  joystickY=dy/max;

  stick.style.left=`calc(50% + ${dx}px)`;
  stick.style.top=`calc(50% + ${dy}px)`;
}

joystick.addEventListener("pointerdown",event=>{
  joystickPointer=event.pointerId;
  joystick.setPointerCapture(event.pointerId);
  moveStick(event);
});

joystick.addEventListener("pointermove",event=>{
  if(event.pointerId===joystickPointer){
    moveStick(event);
  }
});

function resetJoystick(){
  joystickPointer=null;
  joystickX=0;
  joystickY=0;

  stick.style.left="50%";
  stick.style.top="50%";
}

function releaseStick(event){
  if(event.pointerId!==joystickPointer)return;
  resetJoystick();
}

joystick.addEventListener("pointerup",releaseStick);
joystick.addEventListener("pointercancel",releaseStick);
joystick.addEventListener("lostpointercapture",()=>{
  resetJoystick();
});

// ========================================
// 拖曳視角
// ========================================

const worldCanvas=renderer.domElement;

worldCanvas.addEventListener("pointerdown",event=>{
  if(viewMode==="top"&&!selectingStart)return;

  lookingPointer=event.pointerId;

  lastLookX=event.clientX;
  lastLookY=event.clientY;

  lastLookDownX=event.clientX;
  lastLookDownY=event.clientY;

  worldCanvas.setPointerCapture(event.pointerId);
});

worldCanvas.addEventListener("pointermove",event=>{
  if(event.pointerId!==lookingPointer)return;

  const dx=event.clientX-lastLookX;
  const dy=event.clientY-lastLookY;

  if(viewMode==="first"){
    yaw+=dx*.006;
  }

  if(viewMode==="orbit"){
    orbitYaw-=dx*.006;

    orbitPitch=Math.max(
      .25,
      Math.min(1.45,orbitPitch+dy*.006)
    );
  }

  lastLookX=event.clientX;
  lastLookY=event.clientY;
});

worldCanvas.addEventListener("pointerup",event=>{
  if(event.pointerId!==lookingPointer)return;

  const distance=Math.hypot(
    event.clientX-lastLookDownX,
    event.clientY-lastLookDownY
  );

  if(selectingStart && distance<10){
    chooseStartAt(event);
  }

  lookingPointer=null;
});

worldCanvas.addEventListener("pointercancel",()=>{
  lookingPointer=null;
});

// 立體視角可以用滑鼠滾輪縮放。
worldCanvas.addEventListener("wheel",event=>{
  if(viewMode!=="orbit")return;

  event.preventDefault();

  orbitDistance=Math.max(
    15,
    Math.min(55,orbitDistance+event.deltaY*.025)
  );
},{passive:false});

// ========================================
// 鍵盤
// ========================================

window.addEventListener("keydown",event=>{
  const key=event.key.toLowerCase();

  if([
    "w","a","s","d",
    "arrowup","arrowdown",
    "arrowleft","arrowright"
  ].includes(key)){
    event.preventDefault();
    keys.add(key);
  }
});

window.addEventListener("keyup",event=>{
  keys.delete(event.key.toLowerCase());
});

window.addEventListener("blur",()=>{
  keys.clear();
  resetJoystick();
  lookingPointer=null;
});

// ========================================
// 角色移動
// ========================================

function updateMovement(dt){
  if(!mazeReady||selectingStart)return;

  let forward=-joystickY;
  let sideways=joystickX;

  if(keys.has("w")||keys.has("arrowup")){
    forward+=1;
  }

  if(keys.has("s")||keys.has("arrowdown")){
    forward-=1;
  }

  if(keys.has("a")||keys.has("arrowleft")){
    sideways-=1;
  }

  if(keys.has("d")||keys.has("arrowright")){
    sideways+=1;
  }

  const length=Math.hypot(forward,sideways);

  if(length<.08)return;

  const amount=Math.min(1,length);

  forward/=length;
  sideways/=length;

  let dx,dz;

  if(viewMode==="first"){
    dx=
      Math.sin(yaw)*forward+
      Math.cos(yaw)*sideways;

    dz=
      -Math.cos(yaw)*forward+
      Math.sin(yaw)*sideways;
  }else{
    dx=sideways;
    dz=-forward;
  }

  const speed=3*dt*amount;

  // 分軸碰撞：不能穿牆，但可沿牆滑動。
  const nextX=playerX+dx*speed;

  if(!collides(nextX,playerZ)){
    playerX=nextX;
  }

  const nextZ=playerZ+dz*speed;

  if(!collides(playerX,nextZ)){
    playerZ=nextZ;
  }

  updatePlayer();
}

// ========================================
// 畫面更新
// ========================================

function resize(){
  const rect=$("world").getBoundingClientRect();

  if(rect.width<1||rect.height<1)return;

  camera.aspect=rect.width/rect.height;
  camera.updateProjectionMatrix();

  renderer.setSize(
    rect.width,rect.height,false
  );
}

new ResizeObserver(resize).observe($("world"));

const clock=new THREE.Clock();

function animate(){
  const dt=Math.min(clock.getDelta(),.05);

  updateMovement(dt);
  updateCamera();

  renderer.render(scene,camera);
}

resize();
updateCamera();

renderer.setAnimationLoop(animate);

status("V2 準備完成，請拍攝或上傳積木迷宮");

</script>
</body>
</html>
